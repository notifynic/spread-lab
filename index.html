const KEPT = 'spread-lab-key';
const bytes = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));
const text64 = (raw) => btoa(String.fromCharCode(...raw));
async function keyFrom(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(LOCK.salt), iterations: LOCK.rounds }, base, 256));
}
async function unlock(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const packed = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(LOCK.iv) }, key, bytes(LOCK.data));
  const page = await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open();
  document.write(page);
  document.close();
}
const form = document.getElementById('lock');
const say = (text) => (document.getElementById('msg').textContent = text);
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const go = document.getElementById('go');
  go.disabled = true;
  say('Opening…');
  // Read before the lab replaces this page.
  const keep = document.getElementById('keep').checked;
  try {
    const raw = await keyFrom(document.getElementById('pw').value);
    await unlock(raw);
    try {
      if (keep) localStorage.setItem(KEPT, JSON.stringify({ salt: LOCK.salt, key: text64(raw) }));
    } catch {}
  } catch {
    go.disabled = false;
    say('That password does not open it.');
  }
});
(async () => {
  let kept = null;
  try {
    kept = JSON.parse(localStorage.getItem(KEPT) || 'null');
  } catch {}
  if (kept && kept.salt === LOCK.salt) {
    try {
      return await unlock(bytes(kept.key));
    } catch {}
  }
  try {
    localStorage.removeItem(KEPT);
  } catch {}
  form.hidden = false;
  document.getElementById('pw').focus();
})();
</script>
